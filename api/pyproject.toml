[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aws-lambda-powertools>=3.31.1",
    "boto3>=1.43.62",
    "sqlalchemy>=2.0.44",
    "psycopg[binary,pool]>=3.2.9",
    "fastapi>=0.141.1",
    "mangum>=0.19.0",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.10.1",
    "upstash-redis>=1.7.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
# `app` and `authorizer` live at the project root, not in a src/ layout, so the
# root has to be importable for the tests to find them. Without this every run
# needs PYTHONPATH=. in front of it.
pythonpath = ["."]
testpaths = ["__tests__"]
