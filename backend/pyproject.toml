
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relaywise-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

dependencies = [
    "aws-lambda-powertools>=3.25.0",
    "boto3>=1.43.62",
    "composio>=0.18.1",
    "composio-langchain>=0.18.1",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-core>=1.5.3",
    "langchain-openai>=1.1.0",
    "langgraph-checkpoint-postgres>=3.1.1",
    "psycopg[binary,pool]>=3.2.9",
    "sqlalchemy>=2.0.44",
    "alembic>=1.17.2",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "upstash-redis>=1.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
